name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    name: Python simulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run simulator tests
        run: pytest prototype/mra-v0/test_simulator.py -v

  js-contract-tests:
    name: Web-v1 contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package.json"

      - name: Install Node dependencies
        run: npm install

      - name: Run web-v1 mechanic tests
        run: npm test
