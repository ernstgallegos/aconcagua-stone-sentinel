name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    name: Python simulator tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt

      - name: "Lint Python (blocking: ruff E/F/W)"
        run: ruff check prototype/mra-v0/ --select=E,F,W --ignore=E501

      - name: Run simulator tests
        run: pytest prototype/mra-v0/test_simulator.py -v

  json-validation:
    name: Validate /data JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "20"
      - name: Validate data JSON files are well-formed
        run: |
          for f in data/nodes.json data/environmental_pressure_config.json data/action_modifiers.json data/stage_modifiers.json data/characters.json data/outcomes.json data/scenarios.web-v1.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "OK: $f" || (echo "FAIL: $f" && exit 1)
          done
      - name: Validate scenario JSON files
        run: |
          for f in prototype/mra-v0/scenarios/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "OK: $f" || (echo "FAIL: $f" && exit 1)
          done

  js-contract-tests:
    name: Web-v1 contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Verify package and lockfile versions match
        run: npm run check:lock-version

      - name: Install Node dependencies
        run: npm install

      - name: Run web-v1 mechanic tests
        run: npm test

  web-smoke-test:
    name: Web-v1 headless smoke test (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run canonical flow smoke test
        run: pytest prototype/web-v1/tests/test_smoke_flow.py -v
