<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Viewer — Aconcagua: Stone Sentinel</title>
    <link rel="icon" type="image/jpeg" href="/art/brand/favicon-aconcagua.jpg" />
    <link rel="apple-touch-icon" href="/art/brand/favicon-aconcagua.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg-0: #0b0f14;
        --bg-1: #101723;
        --bg-2: #172130;
        --surface-0: #111a27cc;
        --surface-1: #172335d9;
        --surface-2: #213348e6;
        --border-soft: #93a8bc3d;
        --border-strong: #d7e6f252;
        --text-main: #e8eff7;
        --text-dim: #adbbc9;
        --text-muted: #8b9aab;
        --accent-ice: #d6eef9;
        --accent-mineral: #9bb9ce;
        --accent-amber: #d9b996;
        --radius-sm: 14px;
        --radius-md: 22px;
        --shadow-soft: 0 16px 48px #05080d66;
        --serif: "Playfair Display", "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
        --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
        --sans: "Montserrat", "Inter", "Avenir Next", "Segoe UI", Roboto, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--sans);
        line-height: 1.5;
        color: var(--text-main);
        background:
          radial-gradient(1300px 600px at 82% -8%, #b9d0e31f, transparent 58%),
          radial-gradient(900px 460px at 12% -4%, #d9b9961f, transparent 52%),
          linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 42%, var(--bg-0) 100%);
        min-height: 100vh;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.18;
        pointer-events: none;
        background-image:
          linear-gradient(#ffffff04 1px, transparent 1px),
          linear-gradient(90deg, #ffffff04 1px, transparent 1px);
        background-size: 34px 34px;
      }
      .shell { width: min(1220px, 92vw); margin: 0 auto; padding: 1.2rem 0 3rem; }
      .topbar {
        position: sticky; top: .8rem; z-index: 10;
        display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between;
        padding: .85rem; border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
        background: #0f1621c2; backdrop-filter: blur(10px);
        box-shadow: var(--shadow-soft);
      }
      .actions { display:flex; gap:.5rem; flex-wrap: wrap; align-items: center; }
      .btn {
        font-family: var(--mono);
        border:1px solid var(--border-soft); color:var(--text-main); background: var(--surface-0);
        border-radius:999px; padding:.5rem .8rem; text-decoration:none; font-weight:700; font-size:.85rem;
      }
      .btn:hover { text-decoration:none; transform: translateY(-1px); }
      .btn:focus-visible { outline: 2px solid var(--accent-ice); outline-offset: 2px; }
      .title-wrap { display: grid; gap: .2rem; }
      .title-kicker { margin: 0; color: var(--accent-mineral); font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; }
      .title { font-size: .92rem; color: var(--text-dim); margin: 0; }
      .lang-switch { display: inline-flex; gap: 0.2rem; border: 1px solid var(--border-soft); border-radius: 999px; padding: 0.2rem; background: #0e151f99; }
      .lang-btn { font-family: var(--mono); border: 0; border-radius: 999px; background: transparent; color: var(--text-dim); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.32rem 0.54rem; cursor: pointer; }
      .lang-btn[aria-pressed='true'] { color: #081019; background: linear-gradient(120deg, var(--accent-ice), var(--accent-amber)); }
      .lang-btn:focus-visible { outline: 2px solid var(--accent-ice); outline-offset: 1px; }
      article {
        margin-top: 1rem;
        padding: clamp(1rem,2vw,2rem);
        background: linear-gradient(160deg, #152132f0 0%, #101824f0 70%);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-soft);
      }
      h1,h2,h3,h4 { color: var(--text-main); line-height: 1.2; font-family: var(--serif); }
      p, li { color: var(--text-main); }
      a { color: var(--accent-ice); }
      pre { background: #1b2636; padding: .8rem; border-radius: 10px; overflow: auto; border:1px solid var(--border-soft); }
      code { font-family: var(--mono); }
      blockquote { margin: 1rem 0; padding: .6rem .9rem; border-left: 3px solid var(--accent-amber); background: #0d152190; color: var(--text-dim); }
      hr { border: 0; border-top: 1px solid var(--border-soft); margin: 1.2rem 0; }
      table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .92rem; }
      th, td { border: 1px solid var(--border-soft); padding: .5rem; text-align: left; vertical-align: top; }
      th { background: #1a2b3f; color: var(--text-main); }
      .error { color: #ffe4ce; background: #7a243040; border: 1px solid #d0737f80; padding: .8rem; border-radius: 10px; }
      .md-figure { margin: 1rem 0; display: grid; gap: .4rem; }
      .md-image {
        width: 100%;
        max-height: 72vh;
        object-fit: contain;
        border-radius: 12px;
        border: 1px solid var(--border-soft);
        background: #0d152180;
      }
      .md-figcaption { color: var(--text-muted); font-size: .86rem; }
    </style>
      <link rel="stylesheet" href="/public/styles/global-aesthetic.css" />
  </head>
  <body class="public-theme">
    <div class="shell">
      <header class="topbar">
        <div class="title-wrap">
          <p class="title-kicker" id="viewer-kicker">Document viewer</p>
          <p class="title" id="doc-title">Loading document…</p>
        </div>
        <div class="actions">
          <div class="lang-switch" role="group" aria-label="Language selector">
            <button class="lang-btn" type="button" data-lang="en" aria-pressed="true">EN</button>
            <button class="lang-btn" type="button" data-lang="es" aria-pressed="false">ES</button>
          </div>
          <a class="btn" href="/" id="back-link">← Back to landing</a>
          <a class="btn" href="#" target="_blank" rel="noreferrer noopener" id="raw-link">Open raw Markdown</a>
        </div>
      </header>
      <article id="content" aria-live="polite"></article>
    </div>

    <script>
      const allowed = new Set([
        '/meta/project-whitepaper.md',
        '/meta/public-roadmap.md',
        '/docs/repo-truth.md',
        '/README.md',
      ]);

      const params = new URLSearchParams(window.location.search);
      const file = params.get('file') || '/meta/project-whitepaper.md';
      const contentEl = document.getElementById('content');
      const titleEl = document.getElementById('doc-title');
      const rawLinkEl = document.getElementById('raw-link');
      const backLinkEl = document.getElementById('back-link');
      const viewerKickerEl = document.getElementById('viewer-kicker');

      const LANGUAGE_KEY = 'aconcagua_language_v1';
      const TRANSLATIONS = {
        en: {
          kicker: 'Document viewer',
          back: '← Back to landing',
          raw: 'Open raw Markdown',
          loading: 'Loading document…',
          unsupportedTitle: 'Unsupported document',
          unsupportedBody: 'This document is not available in the styled viewer.',
          loadError: 'Unable to load document',
        },
        es: {
          kicker: 'Lector de documentos',
          back: '← Volver al inicio',
          raw: 'Abrir Markdown en bruto',
          loading: 'Cargando documento…',
          unsupportedTitle: 'Documento no disponible',
          unsupportedBody: 'Este documento no está disponible en el visor estilizado.',
          loadError: 'No se pudo cargar el documento',
        },
      };
      let CURRENT_LANG = 'en';

      function t(key) {
        return TRANSLATIONS[CURRENT_LANG]?.[key] || TRANSLATIONS.en[key] || key;
      }

      function applyLanguage(lang) {
        CURRENT_LANG = TRANSLATIONS[lang] ? lang : 'en';
        document.documentElement.lang = CURRENT_LANG;
        if (viewerKickerEl) viewerKickerEl.textContent = t('kicker');
        if (backLinkEl) backLinkEl.textContent = t('back');
        if (rawLinkEl) rawLinkEl.textContent = t('raw');
        if (titleEl && titleEl.dataset.loading === 'true') titleEl.textContent = t('loading');
        try { localStorage.setItem(LANGUAGE_KEY, CURRENT_LANG); } catch (_) {}
        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.setAttribute('aria-pressed', btn.dataset.lang === CURRENT_LANG ? 'true' : 'false');
        });
      }

      function initLanguage() {
        let initial = 'en';
        try {
          const saved = localStorage.getItem(LANGUAGE_KEY);
          const fallback = navigator.language?.toLowerCase().startsWith('es') ? 'es' : 'en';
          initial = TRANSLATIONS[saved] ? saved : fallback;
        } catch (_) {}
        applyLanguage(initial);
        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
        });
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
      }

      function resolveMarkdownUrl(rawUrl) {
        const trimmed = String(rawUrl || '').trim();
        if (!trimmed) return '#';
        if (trimmed.startsWith('#') || trimmed.startsWith('/')) return trimmed;
        if (/^(https?:|mailto:|tel:)/i.test(trimmed)) return trimmed;
        if (/^javascript:/i.test(trimmed)) return '#';

        const slash = file.lastIndexOf('/');
        const baseDir = slash >= 0 ? file.slice(0, slash + 1) : '/';
        try {
          return new URL(trimmed, window.location.origin + baseDir).pathname;
        } catch (_) {
          return '#';
        }
      }

      function inline(md) {
        return md
          .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => {
            const resolved = resolveMarkdownUrl(url);
            const safeAlt = escapeHtml(alt || '');
            const safeCaption = safeAlt ? `<figcaption class="md-figcaption">${safeAlt}</figcaption>` : '';
            return `<figure class="md-figure"><img class="md-image" loading="lazy" src="${escapeHtml(resolved)}" alt="${safeAlt}" />${safeCaption}</figure>`;
          })
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => {
            const resolved = resolveMarkdownUrl(url);
            const external = /^(https?:|mailto:|tel:)/i.test(resolved);
            const rel = external ? ' rel="noreferrer noopener" target="_blank"' : '';
            return `<a href="${escapeHtml(resolved)}"${rel}>${text}</a>`;
          });
      }

      function parseTable(lines, i) {
        if (!/^\|.*\|\s*$/.test(lines[i] || '')) return null;
        if (!/^\|?\s*:?-{3,}/.test(lines[i + 1] || '')) return null;
        const rows = [];
        let j = i;
        while (j < lines.length && /^\|.*\|\s*$/.test(lines[j])) {
          rows.push(lines[j]);
          j++;
        }
        const cells = (row) => row.split('|').slice(1, -1).map((c) => inline(escapeHtml(c.trim())));
        const head = cells(rows[0]);
        const body = rows.slice(2).map(cells);
        let html = '<table><thead><tr>' + head.map((c) => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
        body.forEach((r) => {
          html += '<tr>' + r.map((c) => `<td>${c}</td>`).join('') + '</tr>';
        });
        html += '</tbody></table>';
        return { html, next: j };
      }

      function markdownToHtml(md) {
        const lines = md.replace(/\r\n/g, '\n').split('\n');
        let i = 0;
        let html = '';
        let inCode = false;

        while (i < lines.length) {
          const line = lines[i];

          if (line.startsWith('```')) {
            inCode = !inCode;
            html += inCode ? '<pre><code>' : '</code></pre>';
            i++;
            continue;
          }

          if (inCode) {
            html += escapeHtml(line) + '\n';
            i++;
            continue;
          }

          const t = parseTable(lines, i);
          if (t) {
            html += t.html;
            i = t.next;
            continue;
          }

          if (/^#{1,4}\s/.test(line)) {
            const lvl = line.match(/^#+/)[0].length;
            const text = line.replace(/^#{1,4}\s*/, '');
            html += `<h${lvl}>${inline(escapeHtml(text))}</h${lvl}>`;
            i++;
            continue;
          }

          if (/^\s*[-*]\s+/.test(line)) {
            html += '<ul>';
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
              html += `<li>${inline(escapeHtml(lines[i].replace(/^\s*[-*]\s+/, '')))}</li>`;
              i++;
            }
            html += '</ul>';
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            html += '<ol>';
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
              html += `<li>${inline(escapeHtml(lines[i].replace(/^\s*\d+\.\s+/, '')))}</li>`;
              i++;
            }
            html += '</ol>';
            continue;
          }

          if (/^>\s?/.test(line)) {
            html += `<blockquote>${inline(escapeHtml(line.replace(/^>\s?/, '')))}</blockquote>`;
            i++;
            continue;
          }

          if (/^\s*!\[[^\]]*\]\([^)]+\)\s*$/.test(line)) {
            html += inline(escapeHtml(line.trim()));
            i++;
            continue;
          }

          if (/^---+$/.test(line.trim())) {
            html += '<hr />';
            i++;
            continue;
          }

          if (!line.trim()) {
            i++;
            continue;
          }

          html += `<p>${inline(escapeHtml(line))}</p>`;
          i++;
        }

        return html;
      }

      async function init() {
        titleEl.dataset.loading = 'true';
        titleEl.textContent = t('loading');
        if (!allowed.has(file)) {
          titleEl.dataset.loading = 'false';
          titleEl.textContent = t('unsupportedTitle');
          contentEl.innerHTML = `<p class="error">${escapeHtml(t('unsupportedBody'))}</p>`;
          return;
        }

        titleEl.dataset.loading = 'false';
        titleEl.textContent = file;
        rawLinkEl.href = file;

        try {
          const res = await fetch(file, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const md = await res.text();
          contentEl.innerHTML = markdownToHtml(md);
        } catch (err) {
          contentEl.innerHTML = `<p class="error">${escapeHtml(t('loadError'))} (${escapeHtml(String(err.message || err))}).</p>`;
        }
      }

      initLanguage();
      init();
    </script>
  </body>
</html>
