<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aconcagua: Stone Sentinel — Vertical Slice v1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="kicker">Aconcagua: Stone Sentinel</p>
        <h1>Web Vertical Slice v1</h1>
        <p class="lead">
          Interactive replay of bundled expedition runs from MRA v0. Compare outcomes,
          inspect each turn, and review constraints that forced retreat, wait, or advance.
        </p>
      </header>

      <section class="panel controls">
        <h2>Run loader</h2>
        <div class="form-grid">
          <label>Scenario<select id="scenario"></select></label>
          <label>Seed<input id="seed" type="number" min="1" value="101" /></label>
          <label>
            Policy
            <select id="policy">
              <option value="cautious">cautious</option>
              <option value="aggressive">aggressive</option>
              <option value="waiter">waiter</option>
            </select>
          </label>
        </div>
        <div class="controls-actions">
          <button id="load">Load run</button>
          <p id="status" aria-live="polite"></p>
        </div>
      </section>

      <section id="summary-panel" class="panel" hidden>
        <h2>Run outcome</h2>
        <div id="summary" class="summary-grid"></div>
      </section>

      <section id="timeline-panel" class="panel" hidden>
        <h2>Turn timeline</h2>
        <div id="turns" class="turn-list"></div>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
